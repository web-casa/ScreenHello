[package]
name = "screenhello-desktop"
version = "1.0.4"
description = "ScreenHello Tauri desktop proof of concept"
authors = ["ScreenHello contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/web-casa/ScreenHello"

[lib]
name = "screenhello_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-test-driver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.3.4"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
tempfile = "=3.27.0"
xcap = { version = "=0.9.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
