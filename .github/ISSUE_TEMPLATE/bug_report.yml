name: Bug report
description: 报告可复现的 ScreenHello 缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 安全漏洞或隐私泄漏请使用 SECURITY.md 的私下渠道，不要在这里公开。
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: 版本、commit SHA 或 screenhello.com 的观察日期。
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: browser_version
    attributes:
      label: Browser and OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: 请使用无敏感数据的最小样例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: 我已移除截图、项目文件、日志中的私人或敏感信息。
          required: true
