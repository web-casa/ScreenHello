name: macOS MAS Universal Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select the explicit MAS packaging operation.
        required: true
        type: choice
        default: do-not-package
        options:
          - do-not-package
          - package-mas-universal-candidate
      build_number:
        description: New App Store Connect CFBundleVersion (for a first upload use 1).
        required: true
        type: string
        default: '1'
  push:
    branches: [build/mas-universal-candidate-20260918]

permissions:
  contents: read

concurrency:
  group: macos-mas-universal-${{ github.sha }}-${{ inputs.build_number || '1' }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.96.0
  SCREENHELLO_MAS_OUTPUT: artifacts/stores/mas-universal
  SCREENHELLO_MAS_BUNDLE_ID: ${{ vars.SCREENHELLO_MAS_BUNDLE_ID }}
  SCREENHELLO_MAS_APP_IDENTITY: ${{ vars.SCREENHELLO_MAS_APP_IDENTITY }}
  SCREENHELLO_MAS_INSTALLER_IDENTITY: ${{ vars.SCREENHELLO_MAS_INSTALLER_IDENTITY }}
  SCREENHELLO_MAS_BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  preflight:
    if: >-
      github.repository_id == '1353846676' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/mas-universal-candidate-20260918') &&
      (github.event_name == 'push' || inputs.confirm == 'package-mas-universal-candidate')
    name: MAS credential-free preflight
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust and Apple targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -vV
          cargo -vV

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate the candidate without credentials
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/unit/desktopStoreConfig.test.js tests/unit/masWorkflow.test.js
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features mac-app-store
          pnpm audit:github-actions

  package:
    needs: preflight
    if: >-
      github.repository_id == '1353846676' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/mas-universal-candidate-20260918') &&
      (github.event_name == 'push' || inputs.confirm == 'package-mas-universal-candidate')
    name: Sign MAS app and universal PKG
    runs-on: macos-14
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust and Apple targets
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc -vV
          cargo -vV

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify MAS configuration is available
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_APP_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID MAS_APP_CERTIFICATE_P12_BASE64 MAS_INSTALLER_CERTIFICATE_P12_BASE64 MAS_PROVISIONING_PROFILE_BASE64 SCREENHELLO_MAS_BUNDLE_ID SCREENHELLO_MAS_APP_IDENTITY SCREENHELLO_MAS_INSTALLER_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required MAS configuration is unavailable: $name"
              exit 1
            fi
          done
          case "$SCREENHELLO_MAS_BUILD_NUMBER" in
            ''|*[!0-9.]*|0|0.*) echo '::error::Invalid MAS build number.'; exit 1 ;;
          esac

      - name: Import MAS certificates and provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_APP_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_APP_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/screenhello-mas.keychain-db"
          app_certificate="$RUNNER_TEMP/screenhello-mas-app.p12"
          installer_certificate="$RUNNER_TEMP/screenhello-mas-installer.p12"
          profile="$RUNNER_TEMP/screenhello-mas.provisionprofile"
          original_default="$RUNNER_TEMP/screenhello-mas-default-keychain.txt"
          original_list="$RUNNER_TEMP/screenhello-mas-keychain-list.txt"
          keychain_password="$(openssl rand -base64 48)"

          # Register cleanup locations before any credential operation can fail.
          {
            printf 'SCREENHELLO_MAS_PROFILE=%s\n' "$profile"
            printf 'SCREENHELLO_MAS_KEYCHAIN=%s\n' "$keychain"
            printf 'SCREENHELLO_MAS_DEFAULT_KEYCHAIN=%s\n' "$original_default"
            printf 'SCREENHELLO_MAS_KEYCHAIN_LIST=%s\n' "$original_list"
            printf 'SCREENHELLO_MAS_APP_CERTIFICATE=%s\n' "$app_certificate"
            printf 'SCREENHELLO_MAS_INSTALLER_CERTIFICATE=%s\n' "$installer_certificate"
          } >> "$GITHUB_ENV"

          security default-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_default"
          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_list"
          printf '%s' "$MAS_APP_CERTIFICATE_P12_BASE64" | base64 -D > "$app_certificate"
          printf '%s' "$MAS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -D > "$installer_certificate"
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          keychains=()
          while IFS= read -r entry; do
            if [ -n "$entry" ]; then keychains+=("$entry"); fi
          done < "$original_list"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security default-keychain -s "$keychain"

          # The two P12 files were exported without passwords.
          security import "$app_certificate" -k "$keychain" -P '' -T /usr/bin/codesign
          security import "$installer_certificate" -k "$keychain" -P '' -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          security find-identity -v -p codesigning "$keychain" | grep -F -- "\"$SCREENHELLO_MAS_APP_IDENTITY\"" >/dev/null
          security find-identity -v "$keychain" | grep -F -- "\"$SCREENHELLO_MAS_INSTALLER_IDENTITY\"" >/dev/null
          security cms -D -i "$profile" >/dev/null

      - name: Build and validate the universal MAS package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm desktop:store:package --channel mas --arch universal --output "$SCREENHELLO_MAS_OUTPUT"
          pkg="$SCREENHELLO_MAS_OUTPUT/ScreenHello-mas-universal.pkg"
          evidence="$SCREENHELLO_MAS_OUTPUT/package-evidence.json"
          app='src-tauri/target/universal-apple-darwin/release/bundle/macos/ScreenHello.app'
          test -f "$pkg"
          test -f "$evidence"
          test -d "$app"
          node -e '
            const fs = require("node:fs");
            const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (evidence.channel !== "mas" || evidence.arch !== "universal" || evidence.dirty !== false || evidence.packaging !== "passed" || evidence.releaseReady !== false) process.exit(1);
          ' "$evidence"
          codesign -dv --verbose=4 "$app" 2> "$SCREENHELLO_MAS_OUTPUT/app-signature.txt"
          grep -F -- "Authority=$SCREENHELLO_MAS_APP_IDENTITY" "$SCREENHELLO_MAS_OUTPUT/app-signature.txt"
          : > "$SCREENHELLO_MAS_OUTPUT/macho-architectures.txt"
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$candidate")"
              if [[ " $archs " != *' arm64 '* || " $archs " != *' x86_64 '* ]]; then
                echo "::error::Non-universal Mach-O payload: $candidate ($archs)"
                exit 1
              fi
              printf '%s\t%s\n' "$archs" "${candidate#"$app"/}" >> "$SCREENHELLO_MAS_OUTPUT/macho-architectures.txt"
            fi
          done < <(find "$app" -type f -print0)
          test -s "$SCREENHELLO_MAS_OUTPUT/macho-architectures.txt"
          pkgutil --check-signature "$pkg" 2>&1 | tee "$SCREENHELLO_MAS_OUTPUT/pkg-signature.txt"
          grep -F -- "$SCREENHELLO_MAS_INSTALLER_IDENTITY" "$SCREENHELLO_MAS_OUTPUT/pkg-signature.txt"
          shasum -a 256 "$pkg" > "$SCREENHELLO_MAS_OUTPUT/SHA256SUMS.txt"
          printf 'source=%s\nrun=https://github.com/%s/actions/runs/%s\nbuild-number=%s\ninstallation=not-run\ngui=not-run\nstore-upload=not-run\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$SCREENHELLO_MAS_BUILD_NUMBER" \
            > "$SCREENHELLO_MAS_OUTPUT/build-info.txt"

      - name: Remove temporary MAS signing material
        if: always()
        run: |
          set -euo pipefail
          if [ -f "${SCREENHELLO_MAS_DEFAULT_KEYCHAIN:-}" ]; then
            original_default="$(cat "$SCREENHELLO_MAS_DEFAULT_KEYCHAIN")"
            if [ -n "$original_default" ]; then security default-keychain -s "$original_default" || true; fi
          fi
          if [ -f "${SCREENHELLO_MAS_KEYCHAIN_LIST:-}" ]; then
            keychains=()
            while IFS= read -r entry; do
              if [ -n "$entry" ]; then keychains+=("$entry"); fi
            done < "$SCREENHELLO_MAS_KEYCHAIN_LIST"
            if [ "${#keychains[@]}" -gt 0 ]; then security list-keychains -d user -s "${keychains[@]}" || true; fi
          fi
          if [ -n "${SCREENHELLO_MAS_KEYCHAIN:-}" ] && [ -e "$SCREENHELLO_MAS_KEYCHAIN" ]; then
            security delete-keychain "$SCREENHELLO_MAS_KEYCHAIN"
            test ! -e "$SCREENHELLO_MAS_KEYCHAIN"
          fi
          rm -f \
            "${SCREENHELLO_MAS_APP_CERTIFICATE:-}" \
            "${SCREENHELLO_MAS_INSTALLER_CERTIFICATE:-}" \
            "${SCREENHELLO_MAS_PROFILE:-}" \
            "${SCREENHELLO_MAS_DEFAULT_KEYCHAIN:-}" \
            "${SCREENHELLO_MAS_KEYCHAIN_LIST:-}"

      - name: Upload MAS universal candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ScreenHello-mas-universal-${{ github.sha }}-build-${{ inputs.build_number || '1' }}
          path: artifacts/stores/mas-universal/
          if-no-files-found: error
          retention-days: 14
