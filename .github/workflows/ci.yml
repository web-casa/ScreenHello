name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.1
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check ignored dependency builds
        run: pnpm ignored-builds

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Audit third-party notices
        run: pnpm audit:licenses

      - name: Typecheck public boundaries
        run: pnpm typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Audit translations
        run: pnpm audit:i18n

      - name: Current browser smoke and E2E
        run: pnpm test:e2e

      - name: Web build
        run: pnpm build

      - name: Compression evidence tool contracts (no memory stress)
        run: |
          pnpm test:compression:build
          node --test tests/compression-product/benchmark-contract.test.mjs tests/compression-product/memory-policy.test.mjs

      - name: Audit PWA build
        run: pnpm audit:pwa

      - name: Audit static SEO and GEO pages
        run: pnpm audit:seo

      - name: Production PWA tests
        run: pnpm test:pwa

      - name: Current browser release checks
        run: pnpm test:release:current

      - name: Library build
        run: pnpm build:lib

      - name: Audit library PWA boundary
        run: pnpm audit:pwa:library

      - name: Audit compression assets and pinned codec source
        run: pnpm audit:compression

      - name: Packaged library consumer
        run: pnpm test:consumer

      - name: Build size report
        run: pnpm size:report

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
