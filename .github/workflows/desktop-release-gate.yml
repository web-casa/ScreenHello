name: Desktop Release Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/setup-pnpm/action.yml
      - .github/workflows/desktop-release-gate.yml
      - .github/workflows/linux-deb-repository-signed-candidate.yml
      - .github/workflows/macos-intel-signed-candidate.yml
      - .github/workflows/macos-signed-candidate.yml
      - .github/workflows/windows-arm64-signed-candidate.yml
      - .github/workflows/windows-signed-candidate.yml
      - config/desktop-release-matrix.json
      - config/public-export-manifest.json
      - desktop/**
      - package.json
      - pnpm-lock.yaml
      - scripts/audit-desktop-release-contract.mjs
      - scripts/audit-github-actions-supply-chain.mjs
      - scripts/audit-desktop-artifact-provenance-candidate-workflows.mjs
      - scripts/audit-desktop-release-trust.mjs
      - scripts/audit-linux-deb-repository-key-lifecycle-candidate-workflow.mjs
      - scripts/audit-linux-deb-repository-signed-candidate-workflow.mjs
      - scripts/audit-desktop-codecs.mjs
      - scripts/audit-desktop-poc.mjs
      - scripts/audit-desktop-release-evidence.mjs
      - scripts/audit-desktop-release-workflow.mjs
      - scripts/audit-macos-signed-candidate-workflow.mjs
      - scripts/audit-windows-arm64-signed-candidate-workflow.mjs
      - scripts/audit-windows-signed-candidate-workflow.mjs
      - scripts/build-desktop-test-driver.mjs
      - scripts/collect-desktop-release-evidence.mjs
      - scripts/desktop-message-observer.mjs
      - scripts/desktop-process-tree.mjs
      - scripts/desktop-artifact-provenance-verification.mjs
      - scripts/desktop-artifact-provenance.mjs
      - scripts/desktop-cross-platform-acceptance.mjs
      - scripts/desktop-platform-acceptance.mjs
      - scripts/desktop-release-matrix.mjs
      - scripts/desktop-release-payload-manifest.mjs
      - scripts/desktop-release-publication-plan.mjs
      - scripts/desktop-release-publication-handoff.mjs
      - scripts/desktop-release-github-readiness.mjs
      - scripts/public-repository.mjs
      - scripts/desktop-release-review.mjs
      - scripts/generate-desktop-sbom.mjs
      - scripts/inspect-desktop-artifacts.mjs
      - scripts/linux-deb-key-lifecycle.mjs
      - scripts/linux-deb-repository-matrix.mjs
      - scripts/test-desktop-runtime.mjs
      - src-tauri/**
      - src/desktop/**
      - src/platform/desktopPlatform.js
      - src/utils/avifEncoder.js
      - src/utils/pngEncoder.js
      - src/utils/trustedCodecResourceUrl.js
      - src/utils/webpEncoder.js
      - src/workers/avifEncoder.worker.js
      - src/workers/pngEncoder.worker.js
      - src/workers/webpEncoder.worker.js
      - tests/unit/desktop*.test.js
      - tests/unit/desktopArtifactProvenance.test.js
      - tests/unit/desktopArtifactProvenanceCandidateWorkflowAudit.test.js
      - tests/unit/desktopCrossPlatformAcceptance.test.js
      - tests/unit/desktopReleaseGitHubReadiness.test.js
      - tests/unit/publicRepository.test.js
      - tests/unit/githubActionsSupplyChain.test.js
      - tests/unit/macosSignedCandidateWorkflowAudit.test.js
      - tests/unit/linuxDebRepositoryMatrix.test.js
      - tests/unit/linuxDebRepositoryKeyLifecycleCandidateWorkflowAudit.test.js
      - tests/unit/linuxDebRepositorySignedCandidateWorkflowAudit.test.js
      - tests/unit/windowsArm64SignedCandidateWorkflowAudit.test.js
      - tests/unit/windowsSignedCandidateWorkflowAudit.test.js
      - tests/unit/trustedCodecResourceUrl.test.js
      - vite.config.js

permissions:
  contents: read

concurrency:
  group: desktop-release-gate-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: 0.22.2
  RUST_TOOLCHAIN: 1.96.0
  SCREENHELLO_RELEASE_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
  SCREENHELLO_MATRIX_SOURCE: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  prepare:
    name: Select native candidate matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      scope: ${{ steps.matrix.outputs.scope }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the trusted matrix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request must not choose the runner matrix by changing its
          # own JavaScript or JSON. Manual runs use the candidate SHA itself.
          ref: ${{ env.SCREENHELLO_MATRIX_SOURCE }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Select bounded PR or full manual matrix
        id: matrix
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            scope='pr'
          else
            scope='full'
          fi
          matrix="$(node scripts/desktop-release-matrix.mjs --scope "$scope")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      SCREENHELLO_DESKTOP_GATE_SCOPE: ${{ needs.prepare.outputs.scope }}
      SCREENHELLO_DESKTOP_TARGET: ${{ matrix.target }}
      SCREENHELLO_EXPECTED_DESKTOP_PLATFORM: ${{ matrix.platform }}
      SCREENHELLO_RUNNER_LABEL: ${{ matrix.runner }}
      SCREENHELLO_DESKTOP_RUNTIME_EVIDENCE: artifacts/release/desktop-matrix/${{ matrix.target }}/runtime.json
      SCREENHELLO_DESKTOP_SCREENSHOT: artifacts/release/desktop-matrix/${{ matrix.target }}/runtime.png
      SCREENHELLO_DESKTOP_SBOM_DIR: artifacts/release/desktop-matrix/${{ matrix.target }}
      SCREENHELLO_DESKTOP_ARTIFACT_INSPECTION: artifacts/release/desktop-matrix/${{ matrix.target }}/artifact-inspection.json

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SCREENHELLO_RELEASE_CANDIDATE }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.rust-target }}"
          rustc -vV
          cargo -vV

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            dbus-x11 \
            fonts-noto-cjk \
            libayatana-appindicator3-dev \
            libclang-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check ignored dependency builds
        run: pnpm ignored-builds

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=low

      - name: Audit third-party notices
        run: pnpm audit:licenses

      - name: Verify JavaScript boundaries
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm build

      - name: Audit the desktop gate workflow
        run: |
          pnpm audit:desktop:contract
          pnpm audit:desktop:trust
          pnpm audit:desktop:artifact-provenance
          pnpm audit:desktop:linux-deb-key-lifecycle
          pnpm audit:github-actions
          pnpm audit:desktop:workflow

      - name: Fetch locked Rust dependencies with bounded network retries
        env:
          CARGO_HTTP_TIMEOUT: 120
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --manifest-path src-tauri/Cargo.toml --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Verify Rust boundaries
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          SCREENHELLO_TEST_DRIVER_BUILD=runner-only CARGO_TARGET_DIR=src-tauri/target-test-driver cargo check --manifest-path src-tauri/Cargo.toml --locked --features desktop-test-driver

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429

      - name: Build runner-only test driver
        run: pnpm desktop:build:test-driver

      - name: Exercise embedded desktop runtime on Linux
        if: runner.os == 'Linux'
        env:
          SCREENHELLO_DESKTOP_DRIVER_PROVIDER: embedded
          # Xvfb has no GPU compositor. The default WebKitGTK path can leave
          # render callbacks waiting despite a visible, focused WebView.
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- node scripts/test-desktop-runtime.mjs

      - name: Exercise embedded desktop runtime on macOS or Windows
        if: runner.os != 'Linux'
        env:
          SCREENHELLO_DESKTOP_DRIVER_PROVIDER: embedded
        run: node scripts/test-desktop-runtime.mjs

      - name: Remove the runner-only test build
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned production candidate
        run: |
          started_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          pnpm exec tauri build --ci --bundles "${{ matrix.bundle }}" --no-sign --config src-tauri/tauri.phase9.conf.json
          finished_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "SCREENHELLO_DESKTOP_BUILD_DURATION_MS=$((finished_at - started_at))" >> "$GITHUB_ENV"

      - name: Prove the test driver is absent and audit production codec assets
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --locked > "$RUNNER_TEMP/screenhello-production-cargo-tree.txt"
          if grep -q 'tauri-plugin-wdio-webdriver' "$RUNNER_TEMP/screenhello-production-cargo-tree.txt"; then
            echo 'The production dependency tree contains the runner-only test driver.' >&2
            exit 1
          fi
          pnpm audit:desktop:codecs
          pnpm audit:desktop

      - name: Locate the production artifacts
        run: |
          case "${{ matrix.platform }}:${{ matrix.bundle }}" in
            linux:deb)
              binary='src-tauri/target/release/screenhello-desktop'
              bundle="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)"
              ;;
            macos:dmg)
              binary='src-tauri/target/release/screenhello-desktop'
              bundle="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
              ;;
            windows:nsis)
              binary='src-tauri/target/release/screenhello-desktop.exe'
              bundle="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' -print)"
              ;;
            *)
              echo "Unsupported package selection: ${{ matrix.platform }}:${{ matrix.bundle }}" >&2
              exit 1
              ;;
          esac
          test -f "$binary"
          bundle_count="$(printf '%s\n' "$bundle" | awk 'NF { count += 1 } END { print count + 0 }')"
          test "$bundle_count" -eq 1
          test -f "$bundle"
          echo "SCREENHELLO_DESKTOP_BINARY=$binary" >> "$GITHUB_ENV"
          echo "SCREENHELLO_DESKTOP_BUNDLE=$bundle" >> "$GITHUB_ENV"
          # Preserve the exact bytes if package inspection fails on this runner.
          evidence_dir="artifacts/release/desktop-matrix/${{ matrix.target }}"
          mkdir -p "$evidence_dir"
          cp "$binary" "$bundle" "$evidence_dir/"
          echo 'Package inspection has not passed. This is a diagnostic artifact.' > "$evidence_dir/PACKAGE-NOT-VERIFIED.txt"

      - name: Inspect package identity, architecture, and payload
        run: pnpm desktop:inspect

      - name: Generate software bills of materials
        run: pnpm desktop:sbom

      - name: Collect fail-closed platform evidence
        run: |
          pnpm desktop:evidence
          rm "artifacts/release/desktop-matrix/${{ matrix.target }}/PACKAGE-NOT-VERIFIED.txt"

      - name: Upload unsigned test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-gate-${{ matrix.target }}-${{ env.SCREENHELLO_RELEASE_CANDIDATE }}-${{ github.run_attempt }}
          path: artifacts/release/desktop-matrix/
          if-no-files-found: warn
          retention-days: 14

  summarize:
    name: Current candidate evidence summary
    if: always()
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SCREENHELLO_DESKTOP_GATE_SCOPE: ${{ needs.prepare.outputs.scope }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SCREENHELLO_RELEASE_CANDIDATE }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-gate-*-${{ env.SCREENHELLO_RELEASE_CANDIDATE }}-${{ github.run_attempt }}
          path: artifacts/release/desktop-matrix
          merge-multiple: true

      - name: Audit one-candidate evidence
        run: |
          mkdir -p artifacts/release/desktop-matrix
          node scripts/audit-desktop-release-evidence.mjs | tee artifacts/release/desktop-matrix/automatic-gate.json

      - name: Upload automatic gate summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-gate-summary-${{ env.SCREENHELLO_RELEASE_CANDIDATE }}-${{ github.run_attempt }}
          path: artifacts/release/desktop-matrix/automatic-gate.json
          if-no-files-found: warn
          retention-days: 14
