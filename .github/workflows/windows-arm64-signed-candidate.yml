name: Windows ARM64 Signed Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select the signing operation for this immutable main-branch candidate.
        required: true
        type: choice
        default: do-not-sign
        options:
          - do-not-sign
          - sign-windows-arm64-candidate

permissions:
  contents: read

concurrency:
  group: windows-arm64-signed-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.96.0
  SCREENHELLO_RELEASE_CANDIDATE: ${{ github.sha }}
  SCREENHELLO_DESKTOP_GATE_SCOPE: full
  SCREENHELLO_DESKTOP_TARGET: windows-arm64
  SCREENHELLO_DESKTOP_PACKAGE_CHANNEL: github-actions-windows-arm64-signed-candidate
  SCREENHELLO_RUNNER_LABEL: windows-11-arm
  SCREENHELLO_DESKTOP_ARTIFACT_INSPECTION: artifacts/windows-arm64-signed-candidate/artifact-inspection.json
  SCREENHELLO_DESKTOP_SBOM_DIR: artifacts/windows-arm64-signed-candidate
  SCREENHELLO_WINDOWS_ARM64_SIGNED_CANDIDATE_DIR: artifacts/windows-arm64-signed-candidate

jobs:
  preflight:
    if: >-
      github.repository_id == '1353846102' &&
      github.event.repository.private &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'sign-windows-arm64-candidate'
    name: Windows ARM64 preflight
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the immutable main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust 1.96 and the Windows ARM64 target
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$env:RUST_TOOLCHAIN"
          rustup target add aarch64-pc-windows-msvc
          rustc -vV
          cargo -vV

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify source and signing contracts without credentials
        run: |
          pnpm ignored-builds
          pnpm audit --audit-level=low
          pnpm audit:licenses
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm audit:desktop:contract
          pnpm audit:desktop:trust
          pnpm audit:desktop:artifact-provenance
          pnpm audit:desktop:windows-arm64-signed-candidate
          pnpm audit:github-actions

      - name: Verify the native ARM64 production boundary without a bundle
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target aarch64-pc-windows-msvc
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target aarch64-pc-windows-msvc
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target aarch64-pc-windows-msvc --all-targets -- -D warnings
          pnpm exec tauri build --ci --no-bundle --no-sign --target aarch64-pc-windows-msvc --config src-tauri/tauri.windows-arm64-signed-candidate.conf.json

  sign:
    needs: preflight
    if: >-
      github.repository_id == '1353846102' &&
      github.event.repository.private &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'sign-windows-arm64-candidate'
    name: Sign and timestamp Windows ARM64 candidate
    runs-on: windows-11-arm
    timeout-minutes: 180
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the immutable main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust 1.96 and the Windows ARM64 target
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal
          rustup default "$env:RUST_TOOLCHAIN"
          rustup target add aarch64-pc-windows-msvc
          rustc -vV
          cargo -vV

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Recheck the signed candidate contract before importing credentials
        run: |
          pnpm audit:desktop:contract
          pnpm audit:desktop:trust
          pnpm audit:desktop:artifact-provenance
          pnpm audit:desktop:windows-arm64-signed-candidate
          pnpm audit:github-actions

      - name: Import Windows code-signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Test-CodeSigningCertificate {
            param([System.Security.Cryptography.X509Certificates.X509Certificate2]$Certificate)

            if (-not $Certificate.HasPrivateKey) { return $false }
            foreach ($extension in $Certificate.Extensions) {
              if ($extension.Oid.Value -ne '2.5.29.37') { continue }
              $enhancedKeyUsage = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$extension
              foreach ($usage in $enhancedKeyUsage.EnhancedKeyUsages) {
                if ($usage.Value -eq '1.3.6.1.5.5.7.3.3') { return $true }
              }
            }
            return $false
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw 'WINDOWS_CERTIFICATE is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD must be a non-empty PFX export password.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'screenhello-windows-arm64-signing.pfx'
          $runtimeConfigPath = Join-Path $env:RUNNER_TEMP 'screenhello-windows-arm64-signing-runtime.conf.json'
          $importedThumbprints = @()
          try {
            try {
              $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            } catch {
              throw 'WINDOWS_CERTIFICATE is not valid base64 PFX data.'
            }
            if ($certificateBytes.Length -eq 0) { throw 'WINDOWS_CERTIFICATE is empty.' }
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $securePassword)
            $importedThumbprints = @($imported | ForEach-Object { $_.Thumbprint.ToUpperInvariant() } | Sort-Object -Unique)
            if ($importedThumbprints.Count -eq 0) { throw 'The PFX import returned no certificates.' }
            foreach ($thumbprint in $importedThumbprints) {
              if ($thumbprint -notmatch '^[0-9A-F]{40}$') { throw 'The imported certificate thumbprint is invalid.' }
            }

            $signingCertificates = @($imported | Where-Object { Test-CodeSigningCertificate $_ })
            if ($signingCertificates.Count -ne 1) {
              throw 'The PFX must contain exactly one code-signing certificate with a private key.'
            }
            $thumbprint = $signingCertificates[0].Thumbprint.ToUpperInvariant()
            if ($thumbprint -notmatch '^[0-9A-F]{40}$') { throw 'The code-signing certificate thumbprint is invalid.' }

            $runtimeConfig = Get-Content -LiteralPath 'src-tauri/tauri.windows-arm64-signed-candidate.conf.json' -Raw | ConvertFrom-Json
            $runtimeConfig.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint -Force
            Set-Content -LiteralPath $runtimeConfigPath -Value ($runtimeConfig | ConvertTo-Json -Depth 8) -Encoding utf8NoBOM

            Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_WINDOWS_SIGNING_CONFIG=$runtimeConfigPath"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_WINDOWS_IMPORTED_THUMBPRINTS=$($importedThumbprints -join ',')"
          } catch {
            foreach ($thumbprint in $importedThumbprints) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath $runtimeConfigPath -Force -ErrorAction SilentlyContinue
            throw
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed and timestamped Windows candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $startedAt = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          pnpm exec tauri build --ci --bundles nsis --target aarch64-pc-windows-msvc --config "$env:SCREENHELLO_WINDOWS_SIGNING_CONFIG"
          $finishedAt = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_DESKTOP_BUILD_DURATION_MS=$($finishedAt - $startedAt)"

      - name: Locate the signed production artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDirectory = 'src-tauri/target/aarch64-pc-windows-msvc/release'
          $binary = Join-Path $releaseDirectory 'screenhello-desktop.exe'
          $bundles = @(Get-ChildItem -LiteralPath (Join-Path $releaseDirectory 'bundle/nsis') -File -Filter '*-setup.exe')
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'The Windows ARM64 production executable is missing.' }
          if ($bundles.Count -ne 1) { throw 'Expected exactly one Windows ARM64 NSIS installer.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_DESKTOP_BINARY=$binary"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_DESKTOP_BUNDLE=$($bundles[0].FullName)"

      - name: Inspect signed package identity, architecture, and payload
        run: pnpm desktop:inspect

      - name: Generate signed candidate SBOMs
        run: pnpm desktop:sbom

      - name: Verify Authenticode signature and RFC 3161 timestamp
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateDir = $env:SCREENHELLO_WINDOWS_ARM64_SIGNED_CANDIDATE_DIR
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null

          $signTool = $null
          $kitsRoot = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10 -ErrorAction SilentlyContinue).KitsRoot10
          if ($kitsRoot) {
            $signToolArchitectures = @('arm64', 'x64')
            foreach ($architecture in $signToolArchitectures) {
              $signTools = @(Get-ChildItem -Path (Join-Path $kitsRoot 'bin') -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq $architecture } | Sort-Object FullName)
              if ($signTools.Count -gt 0) {
                $signTool = $signTools[-1].FullName
                break
              }
            }
          }
          if (-not $signTool) {
            $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signToolCommand) { $signTool = $signToolCommand.Source }
          }
          if (-not $signTool) { throw 'signtool.exe is unavailable on this Windows ARM64 runner.' }

          $validationLog = Join-Path $candidateDir 'signtool-validation.txt'
          foreach ($artifact in @($env:SCREENHELLO_DESKTOP_BINARY, $env:SCREENHELLO_DESKTOP_BUNDLE)) {
            "Verifying $artifact" | Add-Content -LiteralPath $validationLog
            $validationOutput = & $signTool verify /pa /all /tw /v $artifact 2>&1
            $exitCode = $LASTEXITCODE
            $validationOutput | Add-Content -LiteralPath $validationLog
            if ($exitCode -ne 0) { throw "signtool verification failed for $artifact." }
          }

          Copy-Item -LiteralPath $env:SCREENHELLO_DESKTOP_BUNDLE -Destination (Join-Path $candidateDir (Split-Path -Leaf $env:SCREENHELLO_DESKTOP_BUNDLE))
          @{
            schemaVersion = 1
            signature = 'authenticode-sha256'
            timestamp = 'rfc3161-sha256'
            verification = 'signtool-verify-pa-all-tw'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $candidateDir 'signing-validation.json') -Encoding utf8NoBOM
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCREENHELLO_WINDOWS_ARM64_SIGNED_INSTALLER=$(Join-Path $candidateDir (Split-Path -Leaf $env:SCREENHELLO_DESKTOP_BUNDLE))"

      - name: Remove temporary Windows signing material
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprints = @(([string]$env:SCREENHELLO_WINDOWS_IMPORTED_THUMBPRINTS -split ',') | Where-Object { $_ -match '^[0-9A-F]{40}$' })
          foreach ($thumbprint in $thumbprints) {
            $certificateStorePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $certificateStorePath) {
              Remove-Item -LiteralPath $certificateStorePath -Force
            }
            if (Test-Path -LiteralPath $certificateStorePath) {
              throw "Temporary code-signing certificate $thumbprint remains in the CurrentUser store."
            }
          }
          $runtimeConfigPath = [string]$env:SCREENHELLO_WINDOWS_SIGNING_CONFIG
          if (-not [string]::IsNullOrWhiteSpace($runtimeConfigPath)) {
            if (Test-Path -LiteralPath $runtimeConfigPath -PathType Leaf) {
              Remove-Item -LiteralPath $runtimeConfigPath -Force
            }
            if (Test-Path -LiteralPath $runtimeConfigPath) {
              throw 'Temporary Windows signing runtime configuration remains after cleanup.'
            }
          }

      - name: Generate signed candidate provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/windows-arm64-signed-candidate/*-setup.exe
          show-summary: false

      - name: Record signed candidate provenance attestation
        env:
          SCREENHELLO_PROVENANCE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          SCREENHELLO_PROVENANCE_ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          SCREENHELLO_PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/desktop-artifact-provenance.mjs `
            --candidate-sha "$env:SCREENHELLO_RELEASE_CANDIDATE" `
            --target windows-arm64 `
            --candidate-dir "$env:SCREENHELLO_WINDOWS_ARM64_SIGNED_CANDIDATE_DIR" `
            --subject "$env:SCREENHELLO_WINDOWS_ARM64_SIGNED_INSTALLER" `
            --attestation-id "$env:SCREENHELLO_PROVENANCE_ATTESTATION_ID" `
            --attestation-url "$env:SCREENHELLO_PROVENANCE_ATTESTATION_URL" `
            --bundle "$env:SCREENHELLO_PROVENANCE_BUNDLE" `
            --runner-temp "$env:RUNNER_TEMP"

      - name: Write signed candidate provenance verification plan
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/desktop-artifact-provenance-verification.mjs `
            --write-plan `
            --candidate-dir "$env:SCREENHELLO_WINDOWS_ARM64_SIGNED_CANDIDATE_DIR"

      - name: Write signed candidate checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateDir = $env:SCREENHELLO_WINDOWS_ARM64_SIGNED_CANDIDATE_DIR
          $files = @(
            $env:SCREENHELLO_WINDOWS_ARM64_SIGNED_INSTALLER,
            (Join-Path $candidateDir 'artifact-inspection.json'),
            (Join-Path $candidateDir 'cargo.cdx.json'),
            (Join-Path $candidateDir 'npm.cdx.json'),
            (Join-Path $candidateDir 'signing-validation.json'),
            (Join-Path $candidateDir 'signtool-validation.txt'),
            (Join-Path $candidateDir 'provenance-attestation.bundle.json'),
            (Join-Path $candidateDir 'provenance-attestation.json'),
            (Join-Path $candidateDir 'provenance-verification-plan.json')
          )
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          Set-Content -LiteralPath (Join-Path $candidateDir 'SHA256SUMS.txt') -Value $checksums -Encoding ascii

      - name: Upload signed Windows ARM64 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-arm64-signed-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/windows-arm64-signed-candidate/
          if-no-files-found: warn
          retention-days: 14
