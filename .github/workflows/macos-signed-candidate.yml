name: macOS Signed Candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select the signing operation for this immutable main-branch candidate.
        required: true
        type: choice
        default: do-not-sign
        options:
          - do-not-sign
          - sign-macos-arm64-candidate

permissions:
  contents: read

concurrency:
  group: macos-signed-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.96.0
  SCREENHELLO_RELEASE_CANDIDATE: ${{ github.sha }}
  SCREENHELLO_DESKTOP_GATE_SCOPE: full
  SCREENHELLO_DESKTOP_TARGET: macos-arm64
  SCREENHELLO_DESKTOP_PACKAGE_CHANNEL: github-actions-macos-signed-candidate
  SCREENHELLO_RUNNER_LABEL: macos-14
  SCREENHELLO_DESKTOP_ARTIFACT_INSPECTION: artifacts/macos-signed-candidate/artifact-inspection.json
  SCREENHELLO_DESKTOP_SBOM_DIR: artifacts/macos-signed-candidate
  SCREENHELLO_MACOS_SIGNED_CANDIDATE_DIR: artifacts/macos-signed-candidate

jobs:
  preflight:
    if: >-
      github.repository_id == '1353846102' &&
      github.event.repository.private &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'sign-macos-arm64-candidate'
    name: macOS ARM64 preflight
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the immutable main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
          cargo -vV

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify source and signing contracts without credentials
        run: |
          pnpm ignored-builds
          pnpm audit --audit-level=low
          pnpm audit:licenses
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm audit:desktop:contract
          pnpm audit:desktop:trust
          pnpm audit:desktop:artifact-provenance
          pnpm audit:desktop:macos-signed-candidate
          pnpm audit:github-actions

      - name: Verify the native production boundary without a bundle
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          pnpm desktop:build

  sign:
    needs: preflight
    if: >-
      github.repository_id == '1353846102' &&
      github.event.repository.private &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'sign-macos-arm64-candidate'
    name: Sign and notarize macOS ARM64 candidate
    runs-on: macos-14
    timeout-minutes: 180
    environment: macos-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the immutable main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Set up project-pinned pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
          cargo -vV

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Recheck the signed candidate contract before importing credentials
        run: |
          pnpm audit:desktop:contract
          pnpm audit:desktop:trust
          pnpm audit:desktop:artifact-provenance
          pnpm audit:desktop:macos-signed-candidate
          pnpm audit:github-actions

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ""
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/screenhello-signing.keychain-db"
          certificate="$RUNNER_TEMP/screenhello-signing.p12"
          original_default="$RUNNER_TEMP/screenhello-signing-default-keychain.txt"
          original_list="$RUNNER_TEMP/screenhello-signing-keychain-list.txt"
          keychain_password="$(openssl rand -base64 48)"
          ready=false
          cleanup() {
            rm -f "$certificate"
            if [ "${ready:-false}" != true ]; then
              if [ -f "$original_default" ]; then
                default_keychain="$(cat "$original_default")"
                if [ -n "$default_keychain" ]; then security default-keychain -s "$default_keychain" || true; fi
              fi
              if [ -f "$original_list" ]; then
                keychains=()
                while IFS= read -r entry; do
                  if [ -n "$entry" ]; then keychains+=("$entry"); fi
                done < "$original_list"
                if [ "${#keychains[@]}" -gt 0 ]; then security list-keychains -d user -s "${keychains[@]}" || true; fi
              fi
              security delete-keychain "$keychain" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          security default-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_default"
          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$original_list"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          keychains=()
          while IFS= read -r entry; do
            if [ -n "$entry" ]; then keychains+=("$entry"); fi
          done < "$original_list"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          case "$identity" in
            *$'\n'*|*$'\r'*) echo 'The imported identity contains invalid control characters.' >&2; exit 1 ;;
            'Developer ID Application:'*) ;;
            *) echo 'A Developer ID Application identity was not imported.' >&2; exit 1 ;;
          esac
          {
            printf '%s\n' "APPLE_SIGNING_IDENTITY=$identity"
            printf '%s\n' "SCREENHELLO_SIGNING_KEYCHAIN=$keychain"
            printf '%s\n' "SCREENHELLO_SIGNING_DEFAULT_KEYCHAIN=$original_default"
            printf '%s\n' "SCREENHELLO_SIGNING_KEYCHAIN_LIST=$original_list"
          } >> "$GITHUB_ENV"
          ready=true

      - name: Build signed and notarized macOS candidate
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          started_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          pnpm exec tauri build --ci --bundles dmg --config src-tauri/tauri.phase9.conf.json
          finished_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          echo "SCREENHELLO_DESKTOP_BUILD_DURATION_MS=$((finished_at - started_at))" >> "$GITHUB_ENV"

      - name: Locate the signed production artifacts
        run: |
          set -euo pipefail
          binary='src-tauri/target/release/screenhello-desktop'
          bundle="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print)"
          test -f "$binary"
          bundle_count="$(printf '%s\n' "$bundle" | awk 'NF { count += 1 } END { print count + 0 }')"
          test "$bundle_count" -eq 1
          test -f "$bundle"
          echo "SCREENHELLO_DESKTOP_BINARY=$binary" >> "$GITHUB_ENV"
          echo "SCREENHELLO_DESKTOP_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Inspect signed package identity, architecture, and payload
        run: pnpm desktop:inspect

      - name: Generate signed candidate SBOMs
        run: pnpm desktop:sbom

      - name: Verify code signature, stapling, and Gatekeeper assessment
        run: |
          set -euo pipefail
          candidate_dir="$SCREENHELLO_MACOS_SIGNED_CANDIDATE_DIR"
          mkdir -p "$candidate_dir"
          mountpoint="$(mktemp -d "$RUNNER_TEMP/screenhello-signed-dmg.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || hdiutil detach -force "$mountpoint" >/dev/null 2>&1 || true
            rm -rf "$mountpoint"
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$SCREENHELLO_DESKTOP_BUNDLE" >/dev/null
          application="$mountpoint/ScreenHello.app"
          test -d "$application"
          codesign --verify --deep --strict --verbose=2 "$application"
          authority="$(codesign -dv --verbose=4 "$application" 2>&1 | sed -n 's/^Authority=\(Developer ID Application:.*\)$/\1/p' | head -n 1)"
          case "$authority" in
            'Developer ID Application:'*) ;;
            *) echo 'The application is not signed by a Developer ID Application identity.' >&2; exit 1 ;;
          esac
          xcrun stapler validate "$application"
          xcrun stapler validate "$SCREENHELLO_DESKTOP_BUNDLE"
          spctl --assess --type open --context context:primary-signature -vv "$application"
          cp "$SCREENHELLO_DESKTOP_BUNDLE" "$candidate_dir/$(basename "$SCREENHELLO_DESKTOP_BUNDLE")"
          echo "SCREENHELLO_MACOS_SIGNED_DMG=$candidate_dir/$(basename "$SCREENHELLO_DESKTOP_BUNDLE")" >> "$GITHUB_ENV"
          cat > "$candidate_dir/signing-validation.json" <<'JSON'
          {
            "schemaVersion": 1,
            "signature": "developer-id-application",
            "notarization": "stapled",
            "gatekeeper": "accepted"
          }
          JSON

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -f "${SCREENHELLO_SIGNING_DEFAULT_KEYCHAIN:-}" ]; then
            original_default="$(cat "$SCREENHELLO_SIGNING_DEFAULT_KEYCHAIN")"
            if [ -n "$original_default" ]; then
              security default-keychain -s "$original_default" || true
            fi
          fi
          if [ -f "${SCREENHELLO_SIGNING_KEYCHAIN_LIST:-}" ]; then
            keychains=()
            while IFS= read -r entry; do
              if [ -n "$entry" ]; then keychains+=("$entry"); fi
            done < "$SCREENHELLO_SIGNING_KEYCHAIN_LIST"
            if [ "${#keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${keychains[@]}" || true
            fi
          fi
          if [ -n "${SCREENHELLO_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SCREENHELLO_SIGNING_KEYCHAIN"
            if [ -e "$SCREENHELLO_SIGNING_KEYCHAIN" ]; then
              echo 'The temporary signing keychain still exists after cleanup.' >&2
              exit 1
            fi
          fi
          rm -f \
            "${SCREENHELLO_SIGNING_DEFAULT_KEYCHAIN:-}" \
            "${SCREENHELLO_SIGNING_KEYCHAIN_LIST:-}"

      - name: Generate signed candidate provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/macos-signed-candidate/*.dmg
          show-summary: false

      - name: Record signed candidate provenance attestation
        env:
          SCREENHELLO_PROVENANCE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          SCREENHELLO_PROVENANCE_ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          SCREENHELLO_PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          node scripts/desktop-artifact-provenance.mjs \
            --candidate-sha "$SCREENHELLO_RELEASE_CANDIDATE" \
            --target macos-arm64 \
            --candidate-dir "$SCREENHELLO_MACOS_SIGNED_CANDIDATE_DIR" \
            --subject "$SCREENHELLO_MACOS_SIGNED_DMG" \
            --attestation-id "$SCREENHELLO_PROVENANCE_ATTESTATION_ID" \
            --attestation-url "$SCREENHELLO_PROVENANCE_ATTESTATION_URL" \
            --bundle "$SCREENHELLO_PROVENANCE_BUNDLE" \
            --runner-temp "$RUNNER_TEMP"

      - name: Write signed candidate provenance verification plan
        run: |
          set -euo pipefail
          node scripts/desktop-artifact-provenance-verification.mjs \
            --write-plan \
            --candidate-dir "$SCREENHELLO_MACOS_SIGNED_CANDIDATE_DIR"

      - name: Write signed candidate checksums
        run: |
          set -euo pipefail
          (
            cd "$SCREENHELLO_MACOS_SIGNED_CANDIDATE_DIR"
            shasum -a 256 \
              "$(basename "$SCREENHELLO_MACOS_SIGNED_DMG")" \
              artifact-inspection.json \
              cargo.cdx.json \
              npm.cdx.json \
              signing-validation.json \
              provenance-attestation.bundle.json \
              provenance-attestation.json \
              provenance-verification-plan.json
          ) > SHA256SUMS.txt

      - name: Upload signed macOS candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-signed-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/macos-signed-candidate/
          if-no-files-found: warn
          retention-days: 14
